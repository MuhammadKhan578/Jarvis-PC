; Jarvis PC - call flow.
; JARVIS_AGI_HOST is replaced by setup_asterisk_wsl.sh with the Windows host IP
; seen from WSL (for example 172.x.x.1). For Docker Desktop use
; host.docker.internal instead.

[general]
static=yes
writeprotect=no

[jarvis-in]
; Softphone dials 1002 -> Jarvis answers and runs FastAGI.
exten => 1002,1,Answer()
 same => n,AGI(agi://JARVIS_AGI_HOST:4573)
 same => n,Hangup()

; Catch-all for a future SIP trunk that sends calls without a 1002 extension.
exten => s,1,Answer()
 same => n,AGI(agi://JARVIS_AGI_HOST:4573)
 same => n,Hangup()

; Safe DTMF fallback menu if speech recognition is unavailable.
exten => 9,1,Answer()
 same => n,Playback(beep)
 same => n,Hangup()

[jarvis-out]
; AMI Originate rings the configured softphone extension, then drops the caller
; into jarvis-in so the same FastAGI prompt runs after they answer.
exten => _X.,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()
