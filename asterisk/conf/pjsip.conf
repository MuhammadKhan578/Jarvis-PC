; Jarvis PC - free local Asterisk extension.
; Extension 1001 is YOUR softphone (Zoiper/MicroSIP/Comet or a SIP app on phone).
; Extension 1002 is handled by Jarvis FastAGI (no SIP phone needed for it).

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=127.0.0.1/255.0.0.0
local_net=10.0.0.0/255.0.0.0
local_net=172.16.0.0/255.240.0.0
local_net=192.168.0.0/255.255.0.0

[1001]
type=endpoint
context=jarvis-in
disallow=all
allow=ulaw
allow=alaw
transport=transport-udp
auth=auth1001
aors=1001
direct_media=no
trust_connected_line=no
send_connected_line=no

[1001]
type=aor
max_contacts=3
remove_existing=yes

[auth1001]
type=auth
auth_type=userpass
username=1001
password=JARVIS_SIP_PASSWORD
